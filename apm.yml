name: transcriptor-srt
version: 1.1.0
description: 'Transcribes audio/video with faster-whisper to SRT, JSONL, or plain
  text. Use for subtitles, captions, or transcripts.'
author: edinsonjim
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, kiro, opencode, windsurf
targets:
- claude
- codex
- copilot
- cursor
- gemini
- opencode
- windsurf
dependencies:
  apm: []
  mcp: []
includes: auto
devDependencies:
  apm: []
scripts: {}
